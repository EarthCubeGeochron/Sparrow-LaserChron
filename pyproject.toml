[project]
name = "sparrow-laserchron"
version = "0.1.0"
description = "Pipelines and schema extensions for the Arizona LaserChron Center's Sparrow lab"
requires-python = ">=3.12"
dependencies = [
  "sparrow-pipelines",
  "pandas>=2.2",
  "xlrd>=2",
  "openpyxl>=3.1",
  "datefinder>=0.7.3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

# Read by a Sparrow server that has this package installed
[project.entry-points."sparrow.plugins"]
laserchron = "laserchron.plugin:LaserChronPlugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["laserchron"]

[tool.pytest.ini_options]
testpaths = ["tests"]
